# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 30  # Hz (lowered from 100 to match STM32 firmware FIFO throughput)

    dummy_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    dummy_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

dummy_arm_controller:
  ros__parameters:
    joints:
      - Joint1
      - Joint2
      - Joint3
      - Joint4
      - Joint5
      - Joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

dummy_gripper_controller:
  ros__parameters:
    joints:
      - Joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
